name: Build docs

on:
  push:
  pull_request:

jobs:
  sphinx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # -W convierte cualquier warning en error: el build tiene que estar limpio.
      - run: python -m sphinx -b html -W --keep-going source build/html
